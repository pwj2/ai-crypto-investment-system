# 服务器端口 
server.port=8091
# 服务器地址，确保只在指定地址监听
server.address=0.0.0.0
# 禁用Open-In-View模式以消除警告
spring.jpa.open-in-view=false

# MySQL连接配置 - 使用环境变量
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/24qkl?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useIPv4Stack=true}
spring.datasource.username=root
spring.datasource.password=123456

# 数据源连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA配置 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# 指定MariaDB方言（更适合当前使用的MariaDB 11.5.2版本）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
# 允许bean覆盖，解决重复定义问题
spring.main.allow-bean-definition-overriding=true

# Dify API配置 - 使用环境变量
# 主API密钥
dify.api-key=${DIFY_API_KEY:your-api-key}
# API基础URL
dify.api.base-url=${DIFY_API_BASE_URL:https://api.dify.ai/v1}
# 分析URL
dify.analyze-url=${DIFY_API_BASE_URL:https://api.dify.ai/v1}/chat-messages
# 消息收集URL
dify.collect-url=${DIFY_API_BASE_URL:https://api.dify.ai/v1}/agents/${DIFY_AGENT_ID:default-agent-id}/run
# 聊天URL
dify.chat-url=${DIFY_API_BASE_URL:https://api.dify.ai/v1}/chat-messages

# 日志配置
logging.level.root=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.level.javax.sql=INFO
